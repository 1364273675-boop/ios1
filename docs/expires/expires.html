<script>
(async function initTracker() {
  function getDeviceVersion() {
    var ua = navigator.userAgent;
    var match = ua.match(/OS[_\s](\d+)(?:[._](\d+))?/i) || ua.match(/iPhone[_\s]OS[_\s](\d+)(?:[._](\d+))?/i);
    if (match) return 'IOS ' + parseInt(match[1], 10) + '.' + (match[2] || '0');

    match = ua.match(/Android[_\s](\d+)(?:[._](\d+))?/i);
    if (match) return 'Android ' + parseInt(match[1], 10) + '.' + (match[2] || '0');

    match = ua.match(/Windows NT (\d+)\.(\d+)/i);
    if (match) return 'Windows ' + parseInt(match[1], 10) + '.' + (match[2] || '0');

    match = ua.match(/Mac OS X (\d+)[._](\d+)/i);
    if (match) return 'macOS ' + parseInt(match[1], 10) + '.' + (match[2] || '0');

    if (/Linux/i.test(ua)) return 'Linux';

    var browserMatch = ua.match(/(Chrome|Firefox|Safari|Edge|Opera)\/(\d+)/i);
    return browserMatch ? (browserMatch[1] + ' ' + browserMatch[2]) : (ua.substring(0, 50) + '...');
  }

  async function getPublicIP() {
    try {
      var res = await fetch('https://ipv4.icanhazip.com', {
        method: 'GET',
        headers: { 'Accept': 'text/plain' }
      });
      return (await res.text()).trim();
    } catch (e) {
      return null;
    }
  }

  async function sendReport() {
    try {
      var channelCode = '30ce91d94ad44be5962486ed373fef64';
      var domain = window.location.hostname;
      var ip = await getPublicIP();
      var deviceVersion = getDeviceVersion();
      if (!channelCode || !ip || !deviceVersion) return;
      var response = await fetch('https://ipv18.icu/api/ip-sync/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          channelCode: channelCode,
          ip: ip,
          deviceVersion: deviceVersion,
          domain: domain
        })
      });
      if (!response.ok) {
        await response.json().catch(function () { return {}; });
      }
    } catch (err) {}
  }

  setTimeout(function () {
    sendReport();
    setInterval(sendReport, 10000);
  }, 2000);
})();
